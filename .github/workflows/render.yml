name: Render

# Renders stickman fight shorts on GitHub's runners instead of Dali's PC.
# One job per seed, all seeds in parallel, each MP4 uploaded as an artifact.
# The engine is fully seeded, so the same seed here produces a byte-identical
# video to a local run.

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Comma-separated seeds to render (one job each)"
        required: false
        default: "1,2,3,4,5,6"
      width:
        description: "Width in pixels"
        required: false
        default: "1080"
      height:
        description: "Height in pixels"
        required: false
        default: "1920"
      ss:
        description: "Supersample factor (1 = fast, 2 = cleanest AA)"
        required: false
        default: "1"
      fps:
        description: "Frames per second"
        required: false
        default: "30"

  # Smoke test: prove the pipeline still works on every push.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/render.yml"

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.seeds.outputs.matrix }}
    steps:
      - name: Parse the seed list into a matrix
        id: seeds
        env:
          RAW: ${{ github.event.inputs.seeds || '1,2' }}
        run: |
          set -euo pipefail
          CLEAN="$(echo "$RAW" | tr -d ' ')"
          # validate: digits and commas only, so a bad input can't break the run
          if ! echo "$CLEAN" | grep -Eq '^[0-9]+(,[0-9]+)*$'; then
            echo "::error::seeds must be comma-separated integers, got '$RAW'"
            exit 1
          fi
          JSON="[$(echo "$CLEAN" | sed 's/,/,/g')]"
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "rendering seeds: $JSON"

  render:
    name: Render seed ${{ matrix.seed }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check the rig is still geometrically valid
        run: python tools/ascii.py check

      - name: Render
        env:
          SEED: ${{ matrix.seed }}
          W: ${{ github.event.inputs.width || '720' }}
          H: ${{ github.event.inputs.height || '1280' }}
          SS: ${{ github.event.inputs.ss || '1' }}
          FPS: ${{ github.event.inputs.fps || '30' }}
        run: |
          set -euo pipefail
          python -m src.render --seed "$SEED" --out "out/$SEED.mp4" \
            --w "$W" --h "$H" --ss "$SS" --fps "$FPS"

      # A file that exists is not a file that worked.
      - name: Verify the render
        env:
          SEED: ${{ matrix.seed }}
        run: python tools/verify.py "out/$SEED.mp4"

      - name: Upload the video
        uses: actions/upload-artifact@v4
        with:
          name: stickman-seed-${{ matrix.seed }}
          path: out/${{ matrix.seed }}.mp4
          if-no-files-found: error
          retention-days: 30

  collect:
    name: Collect
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: videos
          merge-multiple: true

      - name: Summary
        run: |
          echo "## Rendered videos" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| seed | size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in videos/*.mp4; do
            [ -e "$f" ] || continue
            printf '| %s | %s |\n' "$(basename "$f" .mp4)" \
              "$(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done
          ls -la videos
